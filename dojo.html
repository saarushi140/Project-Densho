<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Denshō | Dojo Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- MediaPipe AI Models -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="bg-sumi text-gray-200 font-sans h-screen w-screen overflow-hidden flex flex-col">

    <!-- HUD Header -->
    <header class="h-16 bg-ink/90 border-b border-white/10 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-6">
            <!-- Back Button -->
            <a href="archive.html" class="text-gray-500 hover:text-white transition-colors flex items-center gap-1 text-sm font-mono tracking-widest border-r border-white/10 pr-6">
                &larr; EXIT DOJO
            </a>
            <div class="flex items-center gap-3">
                <span class="text-torii font-serif text-2xl animate-pulse">伝承</span>
                <div>
                    <h1 class="font-bold tracking-[0.2em] text-white uppercase leading-none text-sm">Denshō Core</h1>
                    <span class="text-[9px] tracking-widest text-gold font-mono">WORKSPACE_ACTIVE</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="globalStatusDot" class="w-3 h-3 rounded-full bg-red-600 shadow-[0_0_10px_red]"></div>
            <span id="globalStatusText" class="font-mono text-xs tracking-widest text-gray-400">SYSTEM OFFLINE</span>
        </div>
    </header>

    <!-- Main Dashboard Area -->
    <main class="flex-1 flex w-full overflow-hidden p-4 gap-4">
        
        <!-- LEFT PANEL: The AI Dojo -->
        <section class="flex-[3] flex flex-col relative bg-ink/50 border border-white/10 rounded-xl overflow-hidden shadow-2xl">
            <div class="absolute top-4 left-4 z-20 font-mono text-xs text-white/50 bg-black/50 px-2 py-1 rounded">CAM_FEED // 640x480</div>
            <div class="absolute top-4 right-4 z-20">
                <button id="initBtn" class="bg-blue-600/20 text-blue-400 border border-blue-500/50 hover:bg-blue-600/40 px-4 py-1.5 rounded font-mono text-xs transition-all uppercase tracking-wider cursor-pointer z-50 relative">Initialize AI</button>
            </div>

            <div class="flex-1 relative flex items-center justify-center bg-black overflow-hidden m-2 rounded-lg border border-white/5" id="videoContainer">
                <div class="grid-overlay"></div>
                <span id="videoPlaceholder" class="font-mono tracking-widest text-sm text-gray-600 z-10">AWAITING VIDEO STREAM...</span>
                <video id="inputVideo" class="absolute inset-0 w-full h-full object-cover hidden" playsinline></video>
                <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1] z-10"></canvas>
            </div>

            <div class="h-20 bg-black/40 border-t border-white/10 flex items-center justify-center gap-6 px-6 z-20">
                <button id="recordBtn" class="hud-btn group border-torii/50 text-torii hover:bg-torii/10" disabled>
                    <span class="font-serif text-xl mr-2">師匠</span> RECORD
                </button>
                <button id="stopBtn" class="hud-btn border-white/20 text-gray-400 hover:bg-white/10" disabled>
                    STOP / SAVE
                </button>
                <button id="apprenticeBtn" class="hud-btn group border-jade/50 text-jade hover:bg-jade/10" disabled>
                    <span class="font-serif text-xl mr-2">弟子</span> SYNC
                </button>
            </div>
        </section>

        <!-- RIGHT PANEL: Telemetry -->
        <section class="flex-[1] min-w-[300px] flex flex-col gap-4">
            <div class="bg-ink/80 border border-white/10 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg relative overflow-hidden h-40">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold to-transparent opacity-50"></div>
                <h3 class="text-[10px] font-mono tracking-widest text-gray-400 mb-2 uppercase">Neural Synchronization</h3>
                <div class="flex items-baseline gap-1">
                    <span id="syncScore" class="text-6xl font-bold font-mono text-white tracking-tighter">--</span>
                    <span class="text-xl text-gray-500 font-mono">%</span>
                </div>
                <div class="w-full h-2 bg-black rounded-full mt-4 border border-white/5">
                    <div id="syncBar" class="h-full bg-gold w-0 transition-all duration-75"></div>
                </div>
            </div>

            <div class="bg-ink/80 border border-white/10 rounded-xl p-4 flex-1 shadow-lg flex flex-col">
                <h3 class="text-[10px] font-mono tracking-widest text-gray-400 mb-4 border-b border-white/10 pb-2 uppercase">Spatial Telemetry</h3>
                <div class="font-mono text-sm grid grid-cols-2 gap-y-4">
                    <div class="text-gray-500">X_AXIS:</div> <div id="dataX" class="text-right text-gold">0.0000</div>
                    <div class="text-gray-500">Y_AXIS:</div> <div id="dataY" class="text-right text-gold">0.0000</div>
                    <div class="text-gray-500">Z_DEPTH:</div> <div id="dataZ" class="text-right text-gold">0.0000</div>
                    <div class="text-gray-500">FRAME:</div> <div id="dataFrame" class="text-right text-white">0 / 0</div>
                </div>
                <h3 class="text-[10px] font-mono tracking-widest text-gray-400 mt-auto pt-4 border-t border-white/10 mb-2 uppercase">System Terminal</h3>
                <div id="terminal" class="bg-black/50 border border-white/5 rounded p-2 h-32 overflow-y-auto font-mono text-[10px] text-green-400/80 flex flex-col gap-1">
                    <div>[SYS] Densho Core v1.0 Loaded.</div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
